services:
  democlean_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: democlean_app
    restart: unless-stopped

    # 1. Port Hardening: Bind ONLY to loopback 127.0.0.1 (Blocks external internet scanners)
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

    # 2. Filesystem Security: Read-Only Root Filesystem
    read_only: true

    # 3. Privilege Escalation Prevention
    security_opt:
      - no-new-privileges:true

    # 4. Linux Kernel Capabilities Drop (Zero-Trust)
    cap_drop:
      - ALL

    # 5. Non-executable RAM-based Temporary Directories
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
      - /run:size=16M,noexec,nosuid,nodev

    # 6. Persistent & Isolated Storage Volumes
    volumes:
      - democlean_data:/app/data
      - democlean_cache:/app/.next/cache

    # 7. Hardware Quotas (Anti-Cryptominer & Anti-DoS)
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1024M
          pids: 100
        reservations:
          cpus: '0.20'
          memory: 256M

    networks:
      - web_network

volumes:
  democlean_data:
    name: democlean_data
  democlean_cache:
    name: democlean_cache

networks:
  web_network:
    external: true
