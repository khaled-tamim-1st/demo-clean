kind = "web"
previewPath = "/"
title = "ديمو كلين"
description = "صفحة عربية تفاعلية لشركة ديمو كلين لمكافحة الحشرات والقوارض في الكويت، تعرض الخدمات ومناطق التغطية وخيارات التواصل."
version = "1.0.0"
id = "artifacts/demo-clean"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23594

[services.development]
run = "pnpm --filter @workspace/demo-clean run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/demo-clean", "run", "build" ]
serve = "static"
publicDir = "artifacts/demo-clean/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23594"
BASE_PATH = "/"
